services:
  sboard:
    build: .
    restart: unless-stopped
    environment:
      SBOARD_ENV: production
      SBOARD_ADMIN_TOKEN: ${SBOARD_ADMIN_TOKEN:?set SBOARD_ADMIN_TOKEN}
      SBOARD_DATABASE_URL: sqlite:////app/data/sboard.db
    ports:
      - "23456:80"
    volumes:
      - sboard-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sboard-data:
