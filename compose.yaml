services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SBOARD_ENV: production
      SBOARD_ADMIN_TOKEN: ${SBOARD_ADMIN_TOKEN:?set SBOARD_ADMIN_TOKEN}
      SBOARD_DATABASE_URL: sqlite:////app/data/sboard.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sboard-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  sboard-data:
