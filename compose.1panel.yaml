services:
  backend:
    image: ghcr.io/thefunny233/sboard-backend:latest
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      SBOARD_ENV: production
      SBOARD_ADMIN_TOKEN: ${SBOARD_ADMIN_TOKEN:?请在 1Panel 编排环境变量中设置 SBOARD_ADMIN_TOKEN}
      SBOARD_DATABASE_URL: sqlite:////app/data/sboard.db
    volumes:
      - sboard-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/thefunny233/sboard-frontend:latest
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:23456:80"

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    command: --label-enable --interval 300 --cleanup --rolling-restart
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  sboard-data:
    name: sboard-data
